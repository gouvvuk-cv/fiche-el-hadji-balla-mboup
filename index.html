<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full details of El Hadji Balla MBOUP's profile</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        /* Barre supérieure avec le titre personnalisé */
        .gov-header {
            width: 100%;
            max-width: 800px;
            background-color: #1d5a95;
            color: white;
            padding: 15px 25px;
            font-weight: bold;
            font-size: 18px;
            border-radius: 8px 8px 0 0;
            margin-top: 10px;
            box-sizing: border-box;
            text-align: center;
        }

        .main-container {
            width: 100%;
            max-width: 800px;
            background: white;
            padding: 40px 20px;
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-radius: 0 0 8px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Conteneur du QR Code */
        .qrcode-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .qrcode-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
            border: 1px solid #ddd;
            padding: 10px;
            background-color: #fff;
        }

        .qrcode-caption {
            margin-top: 10px;
            font-size: 14px;
            color: #555;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="gov-header">
        Full details of El Hadji Balla MBOUP's profile
    </div>

    <div class="main-container">
        <div class="qrcode-container">
            <img src="elhadjimboup2.jpeg" alt="QR Code">
            <div class="qrcode-caption">Détails</div>
        </div>
    </div>

</body>
</html>
